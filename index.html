function navigate(tab){current=tab;document.querySelectorAll('.view').forEach(el=>el.classList.toggle('active',el.id===tab));document.getElementById('page-label').textContent=tab.toUpperCase();document.querySelectorAll('[data-tab]').forEach(el=>el.classList.toggle('active',el.dataset.tab===tab));render();window.scrollTo({top:0,behavior:'instant'})}function renderNav(){let items=TABS.map(t=>`<button data-tab="${t[0]}" onclick="navigate('${t[0]}')"><span>${t[1]} &nbsp;</span>${t[2]}</button>`).join('');document.getElementById('nav').innerHTML=items;document.getElementById('mobile-nav').innerHTML=TABS.filter(t=>['dashboard','workout','analytics','history','settings'].includes(t[0])).map(t=>`<button data-tab="${t[0]}" onclick="navigate('${t[0]}')"><b>${t[1]}</b>${t[2]}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(el=>el.classList.toggle('active',el.dataset.tab===current))}function render(){renderNav();let renderers={dashboard:renderDashboard,workout:renderWorkout,exercises:renderExercises,analytics:renderAnalytics,history:renderHistory,body:renderBody,settings:renderSettings};renderers[current]()}function stat(label,value,detail=''){return `<div class="panel stat"><label>${label}</label><strong>${value}</strong><div style="margin-top:9px;color:var(--muted);font-size:12px">${detail}</div></div>`}function renderDashboard(){let wks=weekData(1)[0],prs=prRecords(),last=[...data.workouts].sort((a,b)=>b.date.localeCompare(a.date)||b.savedAt-a.savedAt).slice(0,4),recentW=data.weights.at(-1);document.getElementById('dashboard').innerHTML=`<div class="row" style="align-items:end;flex-wrap:wrap"><div><div class="eyebrow accent">WORKOUT COMMAND CENTER</div><h1>Build stronger. <span class="accent">Every week.</span></h1><p class="subline">Your training, your numbers, your next personal best.</p></div>${button('＋ Start workout','startWorkout()','primary')}</div>${draft?`<div class="notice" style="margin:12px 0 20px;display:flex;justify-content:space-between;ali ckup','navigate(\'settings\')')}</div>`}
function startWorkout(category='PUSH'){if(draft&&draft.exercises.length&&!confirm('Replace your saved workout draft with a new session?'))return;draft={id:id(),date:date(),category,notes:'',exercises:[]};saveDraft();navigate('workout')}function renderWorkout(){let el=document.getElementById('workout');if(!draft){el.innerHTML=`<h1>Live workout</h1><p class="subline">Choose a split, load a template, or resume a saved session.</p><div class="grid cols3">${data.categories.map(c=>`<div class="panel"><h2>${esc(c)}</h2><p style="margin:10px 0 18px">Start a new ${esc(c)} workout.</p>${button('Start session',`startWorkout('${esc(c)}')`,'primary wide')}</div>`).join('')}</div><div class="sectionhead"><h2>Saved templates</h2></div>${templatesHTML()}`;return}el.innerHTML=`<div class="row" style="flex-wrap:wrap"><div><div class="eyebrow accent">LIVE SESSION · AUTOSAVE ON EVERY EDIT</div><div id="autosave-status" class="tiny accent" aria-live="polite">● Saved locally</div><h1>Log your workout</h1><p class="subline">Working sets count toward PRs. Warm-up sets do not.</p></div><div class="row"><div class="timer" id="timerText">${timerLabel()}</div>${button('Rest timer','showTimer()','small')}</div></div><div class="panel"><div class="grid cols3"><div class="field"><label>Training split</label><select onchange="draft.category=this.value;saveDraft();updateLiveSummary()">${data.categories.map(c=>`<option ${c===draft.category?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="field"><label>Workout date</label><input class="input" type="date" value="${esc(draft.date)}" oninput="draft.date=this.value;saveDraft();updateLiveSummary()"></div><div class="field"><label>Exercises</label><strong style="padding:10px">${draft.exercises.length} added</strong></div></div><div class="field" style="margin-top:14px"><label>Session notes (optional)</label><textarea oninput="draft.notes=this.value;saveDraft();updateLiveSummary()" placeholder="Energy, technique, how you felt...">${esc(draft.notes)}</textarea></div></div><div class="sectionhead"><h2>Exercises & sets</h2>${button('＋ Add exercise','showAddExercise()','primary')}</div><div class="stack">${draft.exercises.length?draft.exercises.map((e,i)=>workoutExHTML(e,i)).join(''):'<div class="empty">Your session is empty. Add an exercise, then log individual sets and reps.</div>'}</div><div class="sectionhead"><div><h3>Session summary</h3><p class="tiny" id="live-summary">${draft.exercises.reduce((a,e)=>a+e.sets.filter(s=>!s.warmup&&n(s.reps)>0).length,0)} working sets · ${fmt(draft.exercises.flatMap(e=>e.sets.filter(s=>!s.warmup)).reduce((a,s)=>a+n(s.weight)*n(s.reps),0))} kg volume</p></div><div class="actions">${button('Discard','discardDraft()','danger')}${button('Finish & check PRs','finishWorkout()','primary')}</div></div>`}function workoutExHTML(e,i){let x=exById(e.exerciseId);return `<div class="workout-ex"><div class="row"><div><span class="pill subtle">${esc(x?.category||'EXERCISE')}</span><h3 style="margin-top:8px">${esc(x?.name||'Deleted exercise')}</h3></div>${button('✕ Remove',`removeWorkoutEx(${i})`,'small danger')}</div><div class="setrow set-head" style="color:var(--muted);font-size:11px;margin-top:17px"><span>SET</span><span style="text-align:center">WEIGHT (KG)</span><span style="text-align:center">REPS</span><span style="text-align:center">RPE</span><span style="text-align:center">WARM-UP</span></div>${e.sets.map((s,j)=>`<div class="setrow set-entry"><b class="set-number">${j+1}<span class="set-number-word">SET</span></b><label class="set-field"><span>Weight (kg)</span><input class="input" aria-label="Weight in kilograms for set ${j+1}" inputmode="decimal" type="number" min="0" step="0.5" value="${esc(s.weight)}" oninput="changeSet(${i},${j},'weight',this.value)"></label><label class="set-field"><span>Reps</span><input class="input" aria-label="Repetitions for set ${j+1}" inputmode="numeric" type="number" min="0" step="1" value="${esc(s.reps)}" oninput="changeSet(${i},${j},'reps',this.value)"></label><label class="set-field"><span>RPE</span><input class="input" aria-label="RPE for set ${j+1}" inputmode="decimal" type="number" min="1" max="10" step=".5" value="${esc(s.rpe??'')}" oninput="changeSet(${i},${j},'rpe',this.value)"></label><label class="set-warm"><span>Warm-up</span><input type="checkbox" ${s.warmup?'checked':''} onchange="changeSet(${i},${j},'warmup',this.checked)" aria-label="Warm-up set ${j+1}"></label><button class="btn small danger set-delete" onclick="removeSet(${i},${j})" title="Remove set ${j+1}" aria-label="Remove set ${j+1}">×</button></div>`).join('')}<div class="row" style="margin-top:15px;flex-wrap:wrap">${button('＋ Add set',`addSet(${i})`,'small')}${button('90s rest',`startRest(90)`,'small ghost')}</div></div>`}function changeSet(i,j,k,val){let s=draft?.exercises[i]?.sets[j];if(!s)return;s[k]=k==='warmup'?val:(val===''?'':n(val));saveDraft();updateLiveSummary()}function addSet(i){let e=draft.exercises[i],last=e.sets.at(-1)||{weight:'',reps:8,rpe:'',warmup:false};e.sets.push({...last,warmup:false});saveDraft();renderWorkout()}function removeSet(i,j){draft.exercises[i].sets.splice(j,1);saveDraft();renderWorkout()}function removeWorkoutEx(i){draft.exercises.splice(i,1);saveDraft();renderWorkout()}function discardDraft(){if(confirm('Discard this workout draft?')){draft=null;saveDraft();renderWorkout()}}function showAddExercise(){modal(`<h2>Add exercise</h2><p style="margin-bottom:15px">Previous session sets will be filled in automatically.</p><input class="input" id="exSearch" placeholder="Search exercises..." oninput="filterPick(this.value)"><div id="exPick" class="stack" style="margin-top:16px;max-height:350px;overflow:auto"></div><div class="divider"></div>${button('Create new exercise','closeModal();navigate(\'exercises\')')}`);filterPick('')}function filterPick(q){document.getElementById('exPick').innerHTML=data.exercises.filter(e=>(e.name+' '+e.category).toLowerCase().includes(q.toLowerCase())).map(e=>`<button class="btn" style="text-align:left" onclick="pickExercise('${e.id}')">${esc(e.name)} <span class="muted tiny">· ${esc(e.category)}</span></button>`).join('')||'<div class="empty">No matching exercises</div>'}function pickExercise(eid){if(draft.exercises.some(e=>e.exerciseId===eid)){toast('Exercise already added');return}let last=lastEx(eid);draft.exercises.push({exerciseId:eid,sets:last?clone(last.sets):[{weight:'',reps:8,rpe:'',warmup:false}]});saveDraft();closeModal();renderWorkout()}function finishWorkout(){if(!draft?.exercises.length){toast('Add an exercise first');return}let ws=clone(draft);ws.exercises=ws.exercises.map(e=>({...e,sets:e.sets.filter(s=>n(s.reps)>0&&s.weight!==''&&n(s.weight)>=0)})).filter(e=>e.sets.length);if(!ws.exercises.length){toast('Enter at least one valid set');return}ws.savedAt=Date.now();let found=findPRs(ws);data.workouts.push(ws);if(!persist())return;draft=null;saveDraft();navigate('dashboard');if(found.length)showPRs(found);else toast('Workout saved! Keep building your baseline.')}function findPRs(w){let output=[];for(let e of w.exercises){let old=exSets(e.exerciseId),incoming=e.sets.filter(s=>!s.warmup&&n(s.weight)>0&&n(s.reps)>0);if(!incoming.length||!old.length)continue;let x=exById(e.exerciseId),name=x?.name||'Exercise';const record=(type,oldV,newV,suffix)=>{if(newV>oldV+1e-8)output.push({name,type,old:oldV,new:newV,suffix})};record('Heaviest weight',Math.max(...old.map(s=>n(s.weight))),Math.max(...incoming.map(s=>n(s.weight))),'kg');let oldRepByWeight={};for(let s of old)oldRepByWeight[n(s.weight)]=Math.max(oldRepByWeight[n(s.weight)]||0,n(s.reps));let repWinners=incoming.filter(s=>oldRepByWeight[n(s.weight)]!==undefined&&n(s.reps)>oldRepByWeight[n(s.weight)]).map(s=>({old:oldRepByWeight[n(s.weight)],new:n(s.reps),weight:n(s.weight)}));if(repWinners.length){repWinners.sort((a,b)=>(b.new-b.old)-(a.new-a.old));let r=repWinners[0];output.push({name,type:`Rep PR at ${fmt(r.weight)} kg`,old:r.old,new:r.new,suffix:'reps'})}record('Estimated 1RM',Math.max(...old.map(e1rm)),Math.max(...incoming.map(e1rm)),'kg');record('Best set volume',Math.max(...old.map(s=>n(s.weight)*n(s.reps))),Math.max(...incoming.map(s=>n(s.weight)*n(s.reps))),'kg');let oldVol=Math.max(...allSessions(e.exerciseId).map(w=>w.exercises.filter(x=>x.exerciseId===e.exerciseId).flatMap(x=>x.sets).filter(s=>!s.warmup).reduce((a,s)=>a+n(s.weight)*n(s.reps),0)));let newVol=incoming.reduce((a,s)=>a+n(s.weight)*n(s.reps),0);record('Session volume',oldVol,newVol,'kg')}return output}function showPRs(prs){modal(`<div class="pricon">🏆</div><h2 style="text-align:center;color:var(--green)">NEW PERSONAL RECORD!</h2><p style="text-align:center;margin-bottom:16px">You broke ${prs.length} previous record${prs.length>1?'s':''}. Amazing work!</p>${prs.map(p=>`<div class="prdetail"><div><b>${esc(p.name)}</b><div class="muted tiny">${esc(p.type)}</div><div class="muted tiny">Previous: ${fmt(p.old)} ${esc(p.suffix)}</div></div><div style="text-align:right"><b class="accent">${fmt(p.new)} ${esc(p.suffix)}</b><div class="tiny accent">+${fmt(p.new-p.old)} ${esc(p.suffix)}</div></div></div>`).join('')}<div style="margin-top:18px">${button('Keep progressing ✨','closeModal()','primary wide')}</div>`) }
function renderExercises(){document.getElementById('exercises').innerHTML=`<div class="row" style="flex-wrap:wrap"><div><h1>Exercise library</h1><p class="subline">Build a customised library for every training split.</p></div>${button('＋ New exercise','newExerciseModal()','primary')}</div><div class="panel"><div class="row" style="flex-wrap:wrap"><input class="input search" placeholder="Filter exercises..." oninput="document.querySelectorAll('.library-ex').forEach(e=>e.hidden=!e.textContent.toLowerCase().includes(this.value.toLowerCase()))"><span class="muted">${data.exercises.length} exercises · ${data.categories.length} categories</span></div><div class="divider"></div><div class="grid cols3">${data.exercises.map(x=>`<div class="exercise-card library-ex"><span class="pill">${esc(x.category)}</span><div class="name" style="margin:12px 0 6px">${esc(x.name)}</div><div class="muted tiny">${esc(x.muscle||'General')}</div><div class="row" style="margin-top:12px"><span class="muted tiny">${exSets(x.id).length} logged sets</span>${button('View ↗',`showExerciseDetails('${x.id}')`,'small')}</div></div>`).join('')}</div></div><div class="sectionhead"><h2>Custom splits</h2>${button('＋ Add split','newCategoryModal()')}</div><div class="actions">${data.categories.map(c=>`<span class="pill subtle">${esc(c)}</span>`).join('')}</div>`}function newExerciseModal(){modal(`<h2>Add exercise</h2><div class="stack"><div class="field"><label>Exercise name</label><input id="newExName" class="input" placeholder="e.g. Incline Smith Press"></div><div class="field"><label>Training category</label><select id="newExCat">${data.categories.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div class="field"><label>Muscle group</label><input id="newExMuscle" class="input" placeholder="e.g. Chest"></div>${button('Save exercise','saveNewExercise()','primary wide')}</div>`)}function saveNewExercise(){let name=document.getElementById('newExName').value.trim(),category=document.getElementById('newExCat').value,muscle=document.getElementById('newExMuscle').value.trim();if(!name)return toast('Enter exercise name');if(data.exercises.some(e=>e.name.toLowerCase()===name.toLowerCase()))return toast('Exercise already exists');data.exercises.push({id:id(),name,category,muscle});persist();closeModal();renderExercises();toast('Exercise added')}function newCategoryModal(){modal(`<h2>Create training split</h2><p style="margin-bottom:15px">Examples: UPPER, LOWER, FULL BODY.</p><input id="catName" class="input" placeholder="Split name"> <div style="margin-top:15px">${button('Create split','saveCategory()','primary wide')}</div>`)}function saveCategory(){let c=document.getElementById('catName').value.trim().toUpperCase();if(!c||data.categories.includes(c))return toast('Enter a unique split');data.categories.push(c);persist();closeModal();renderExercises()}function showExerciseDetails(eid){let e=exById(eid),s=exSets(eid),sessions=allSessions(eid);if(!e)return;modal(`<span class="pill">${esc(e.category)}</span><h2 style="margin-top:12px">${esc(e.name)}</h2><p style="margin-bottom:16px">${esc(e.muscle)} · ${sessions.length} sessions</p><div class="grid cols2">${stat('Heaviest working set',s.length?fmt(Math.max(...s.map(x=>n(x.weight))))+' kg':'—')}${stat('Best estimated 1RM',s.length?fmt(Math.max(...s.map(e1rm)))+' kg':'—')}</div><div class="sectionhead"><h3>Weight progression</h3></div>${lineChart(sessions.map(w=>({label:dateFmt(w.date),val:Math.max(0,...w.exercises.filter(x=>x.exerciseId===eid).flatMap(e=>e.sets.filter(s=>!s.warmup).map(s=>n(s.weight))))})),'kg')}<div class="divider"></div><div class="actions">${button('See full analytics',`closeModal();navigate('analytics');setAnalyticExercise('${eid}')`,'primary')}${button('Close','closeModal()')}</div>`)}
function renderAnalytics(){let opts=data.exercises.filter(e=>exSets(e.id).length);let chosen=window.analysisEx&&opts.some(e=>e.id===window.analysisEx)?window.analysisEx:opts[0]?.id;window.analysisEx=chosen;let ss=chosen?allSessions(chosen):[],series=ss.map(w=>{let sets=w.exercises.filter(e=>e.exerciseId===chosen).flatMap(e=>e.sets.filter(s=>!s.warmup&&n(s.reps)>0));return{label:dateFmt(w.date),max:Math.max(0,...sets.map(s=>n(s.weight))),one:Math.max(0,...sets.map(e1rm)),vol:sets.reduce((a,s)=>a+n(s.weight)*n(s.reps),0)}});let all=data.workouts;let full=weekData(rangeWeeks);document.getElementById('analytics').innerHTML=`<h1>Deep analytics</h1><p class="subline">See strength, training load and consistency over time. Baselines require saved sessions.</p><div class="row" style="margin-bottom:14px;flex-wrap:wrap"><h2>Weekly training trends</h2><div class="dropdownrow"><span class="muted tiny">Period</span><select onchange="rangeWeeks=Number(this.value);renderAnalytics()">${[8,12,24,52].map(x=>`<option value="${x}" ${rangeWeeks===x?'selected':''}>${x} weeks</option>`).join('')}</select></div></div><div class="grid cols3">${stat('Total volume',fmt(all.reduce((a,w)=>a+volume(w),0))+' kg')}${stat('Total working sets',all.reduce((a,w)=>a+workoutSets(w).length,0))}${stat('Total workouts',all.length)}</div><div class="grid cols2" style="margin-top:15px"><div class="panel"><h3>Training tonnage (kg)</h3>${barChart(full.map(w=>({label:w.label,val:w.volume})),'kg')}</div><div class="panel"><h3>Workouts per week</h3>${barChart(full.map(w=>({label:w.label,val:w.sessions})),'sessions')}</div></div><div class="sectionhead"><h2>Exercise progression</h2><select style="max-width:310px" onchange="setAnalyticExercise(this.value)">${opts.length?opts.map(e=>`<option value="${e.id}" ${e.id===chosen?'selected':''}>${esc(e.name)}</option>`).join(''):'<option>No exercise data yet</option>'}</select></div><div class="grid cols3">${stat('Heaviest weight',series.length?fmt(Math.max(...series.map(s= function renderBody(){let weights=[...data.weights].sort((a,b)=>a.date.localeCompare(b.date)),latest=weights.at(-1),bmi=latest&&data.height>0?n(latest.weight)/((data.height/100)**2):null;document.getElementById('body').innerHTML=`<div class="row" style="flex-wrap:wrap"><div><h1>Body metrics</h1><p class="subline">Track bodyweight trends and BMI over time.</p></div>${button('＋ New weigh-in','newWeightModal()','primary')}</div><div class="grid cols3">${stat('Current weight',latest?fmt(n(latest.weight))+' kg':'—',latest?'Last logged '+dateFmt(latest.date):'No weigh-ins yet')}${stat('Body mass index',bmi?fmt(bmi):'—',bmi?bmi<18.5?'Below standard adult range':bmi<25?'Within standard adult range':bmi<30?'Above standard adult range':'Higher than standard adult range':'Add height and weight')}${stat('Height',data.height?data.height+' cm':'—',button('Edit height','editHeight()','small'))}</div><div class="grid cols2" style="margin-top:15px"><div class="panel"><h3>Bodyweight trend</h3>${lineChart(weights.map(w=>({label:dateFmt(w.date),val:n(w.weight)})),'kg')}</div><div class="panel"><h3>BMI trend</h3>${data.height?lineChart(weights.map(w=>({label:dateFmt(w.date),val:n(w.weight)/((data.height/100)**2)})),'BMI'):'<div class="empty">Enter your height to see BMI history.</div>'}</div></div><div class="sectionhead"><h2>Weigh-in history</h2></div><div class="panel">${weights.length?weights.reverse().map(w=>`<div class="metric"><span>${dateFmt(w.date)}</span><div class="row"><b>${fmt(n(w.weight))} kg</b>${button('Delete',`deleteWeight('${w.id}')`,'small danger')}</div></div>`).join(''):'<div class="empty">No measurements yet.</div>'}</div><p class="settingsnote">BMI is weight (kg) divided by height (m) squared. It is a crude screening measure and may not reflect body composition accurately in muscular people.</p>`}function editHeight(){modal(`<h2>Set your height</h2><p style="margin-bottom:14px">Height is used to calculate BMI.</p><input id="heightInput" class="input" type="number" // Account boundaries: never let one Google identity inherit another account's local records.
function switchAccountStorage(uid){
  const safeId=uid&&/^[A-Za-z0-9_-]{1,128}$/.test(uid)?uid:null;
  KEY=ACCOUNT_PREFIX+(safeId?'user_'+safeId+'_data':'guest_data');
  DRAFT=ACCOUNT_PREFIX+(safeId?'user_'+safeId+'_draft':'guest_draft');
  let nextData=null,nextDraft=null;
  try{nextData=JSON.parse(localStorage.getItem(KEY)||'null')}catch{}
  if(!nextData||!Array.isArray(nextData.exercises)||!Array.isArray(nextData.workouts))nextData=initial();
  nextData.categories||=['PUSH','PULL','LEGS'];nextData.weights||=[];nextData.templates||=[];nextData.height||=0;
  try{nextDraft=JSON.parse(localStorage.getItem(DRAFT)||'null')}catch{}
  if(!nextDraft||!Array.isArray(nextDraft.exercises)||!nextDraft.id)nextDraft=null;
  data=nextData;draft=nextDraft;

function exportText(filename,content,type){let blob=new Blob([content],{type}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}function exportAll(){exportText('ironlog-backup-'+date()+'.json',JSON.stringify({version:1,exportedAt:new Date().toISOString(),data,draft},null,2),'application/json')}function csv(rows){return rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')}function exportCSV(){let rows=[['Workout ID','Date','Category','Exercise','Weight (kg)','Reps','RPE','Warmup','Notes']];for(let w of data.workouts)for(let ex of w.exercises)for(let s of ex.sets)rows.push([w.id,w.date,w.category,exById(ex.exerciseId)?.name||ex.exerciseId,s.weight,s.reps,s.rpe,s.warmup?'Yes':'No',w.notes]);exportText('ironlog-workouts-'+date()+'.csv',csv(rows),'text/csv')}function exportWeightCSV(){exportText('ironlog-bodyweight-'+date()+'.csv',csv([['Date','Weight (kg)','Height (cm)','BMI'],...data.weights.map(w=>[w.date,w.weight,data.height||'',data.height?fmt(n(w.weight)/((data.height/100)**2)):''])]),'text/csv')}function importAll(file){if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let imported=JSON.parse(reader.result),v=imported.data||imported;if(!Array.isArray(v.workouts)||!Array.isArray(v.exercises)||!Array.isArray(v.weights)||!Array.isArray(v.categories)||!Array.isArray(v.templates))throw Error('Invalid backup');if(!confirm('Replace ALL current local data with this backup?'))return;data=v;persist();draft=imported.draft&&Array.isArray(imported.draft.exercises)?imported.draft:null;saveDraft();render();toast('Backup restored')}catch(e){alert('Could not import backup: '+e.message)}};reader.readAsText(file)}function prRecords(){return data.exercises.filter(e=>exSets(e.id).length).map(e=>({name:e.name,weight:Math.max(...exSets(e.id).map(s=>n(s.weight)))}))}
